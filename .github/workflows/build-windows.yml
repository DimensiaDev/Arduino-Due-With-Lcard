name: Build Windows exe

# Один файл .exe со всеми библиотеками (PyInstaller, --onefile).
# Всё приложение живёт в пакете dualsine/, точка входа — dualsine/__main__.py
# (локальный запуск: python -m dualsine из корня репозитория).
# Запускается автоматически при изменении исходников и вручную:
# Actions -> Build Windows exe -> Run workflow.

on:
  push:
    branches: [FIX_CALIBRATION]
    paths:
      - "dualsine/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Состав приложения ставим списком (те же версии, что и в
      # requirements.txt, без matplotlib — он приложению не нужен
      # и сильно раздувает .exe).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.6" `
            "PySide6==6.11.0" `
            "numpy==2.4.4" `
            "pandas==3.0.2" `
            "scipy==1.16.3" `
            "pyserial==3.5" `
            "pylsl==1.18.1"

      - name: Import smoke test
        run: |
          python -c "import dualsine.app, dualsine.main_window; print('import ok')"

      # --paths . добавляет корень репозитория в путь поиска,
      # чтобы пакет dualsine разрешался при анализе входной точки.
      - name: Build one-file exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name DualSineController `
            --icon icon.ico `
            --paths . `
            --collect-all pylsl `
            --hidden-import=pylsl `
            --hidden-import=serial.tools.list_ports `
            dualsine/__main__.py
          Get-Item dist\DualSineController.exe | Format-List Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: DualSineController-windows
          path: dist/DualSineController.exe
          if-no-files-found: error
