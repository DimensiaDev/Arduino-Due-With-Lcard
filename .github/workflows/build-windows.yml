name: Build Windows exe

# Один файл .exe со всеми библиотеками (PyInstaller, --onefile).
# Запускается автоматически при изменении исходника в control/main1.py
# и вручную: Actions -> Build Windows exe -> Run workflow.

on:
  push:
    branches: [FIX_CALIBRATION]
    paths:
      - "control/main1.py"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # control/requirements.txt записан в UTF-16, поэтому ставим состав
      # приложения списком (те же версии, что и в requirements.txt,
      # без matplotlib — он приложению не нужен и сильно раздувает .exe).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.6" `
            "PySide6==6.11.0" `
            "numpy==2.4.4" `
            "pandas==3.0.2" `
            "scipy==1.16.3" `
            "pyserial==3.5" `
            "pylsl==1.18.1"

      - name: Import smoke test
        run: |
          cd control
          python -c "import main1; print('import ok')"

      - name: Build one-file exe
        working-directory: control
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name DualSineController `
            --icon ../icon.ico `
            --collect-all pylsl `
            --hidden-import=pylsl `
            --hidden-import=serial.tools.list_ports `
            main1.py
          Get-Item dist\DualSineController.exe | Format-List Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: DualSineController-windows
          path: control/dist/DualSineController.exe
          if-no-files-found: error
